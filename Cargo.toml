[workspace]
members = [
    ".",
    "src/teloxide_plugin"
]
[package]
name = "kissshot_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
colored = "2.0"
async_once = "0.2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
bb8 = "0.9"
bb8-redis = "0.24"
redis = { version = "0.32", features = ["tokio-rustls-comp"], default-features = false }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
aws-lc-rs = { version = "1.0.0-rc1" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid"] }
teloxide = { version = "0.17", features = ["full"] }
inventory = "0.3"
teloxide_plugin = { path = "src/teloxide_plugin" }
once_cell = "1.21.3"
anyhow = "1.0.100"
rand = "0.9.2"
reqwest = "0.12.23"
hostname = "0.3"
num_cpus = "1.0"
ccgen_rs = "0.1.0"
regex = "1.11.2"
grammers-client = { git = "https://github.com/Lonami/grammers" }
